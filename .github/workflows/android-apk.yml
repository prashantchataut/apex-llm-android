# Builds, signs, VERIFIES and (for tags / manual dispatch) publishes the arm64-v8a Apex LLM APK.
#
# Runs on EVERY push (any branch) so each commit yields a downloadable, gate-checked APK artifact.
# A GitHub Release is created only for `v*` tags, or a manual run with `publish: true`.
#
# Pipeline order (required for Android 14-16 / Nothing OS strict installers):
#   1. cargo tauri android build  -> UNSIGNED universal release APK (targetSdk 34, arm64-v8a only, 16 KB-linked ELF)
#   2. zipalign -p -f -v 4        -> BEFORE signing (signing invalidates alignment, never the other way round)
#   3. apksigner sign             -> v1 + v2 + v3 with the permanent keystore from repo secrets
#   4. scripts/verify-apk.sh      -> hard gate: signatures, manifest, ABI, ELF alignment; any failure aborts the job
#
# Signing key: repo secrets APEX_KEYSTORE_B64 (base64 PKCS12) + APEX_KS_PASS. The SAME certificate signs every release,
# so updates install over each other. Without the secret a throwaway key is used for non-release builds only.
name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to (created if missing)
        default: v1.5.0
      publish:
        description: Publish a GitHub Release
        type: boolean
        default: false

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 28.0.12433566
      # 16 KB page alignment is set in app-ui/src-tauri/build.rs (the Tauri CLI overrides CARGO_TARGET_*_RUSTFLAGS) + NDK r28 defaults.
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-showcase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK and NDK
        run: |
          set -x
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)
          echo "$SM" >> "$GITHUB_PATH"
          export PATH="$SM:$PATH"
          SDK=$(grep -oP 'compileSdk = \K[0-9]+' app-ui/src-tauri/gen/android/app/build.gradle.kts)
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-${SDK}" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-ui/src-tauri
      - name: Frontend deps
        working-directory: web-showcase
        run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - name: Tauri CLI (cargo subcommand)
        run: cargo install tauri-cli --version "^2" --locked
      - name: Version and tag sanity
        run: |
          VERSION=$(jq -r .version app-ui/src-tauri/tauri.conf.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$PUBLISH" = "true" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match tauri.conf.json version $VERSION"; exit 1
          fi
      - name: Build UNSIGNED release APK (arm64-v8a)
        working-directory: app-ui
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_HOME="$NDK_HOME"
          cargo tauri android build --apk --target aarch64 --features android
      - name: Align, sign (v2+v3, v1 when apksigner emits it) and verify
        id: pack
        env:
          APEX_KEYSTORE_B64: ${{ secrets.APEX_KEYSTORE_B64 }}
          APEX_KS_PASS: ${{ secrets.APEX_KS_PASS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/35.* | sort -V | tail -1)
          UNSIGNED=$(find app-ui/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path '*release*' | head -1)
          echo "unsigned: $UNSIGNED"
          unzip -l "$UNSIGNED" | grep -E "lib/|classes|resources.arsc" || true

          KS="$RUNNER_TEMP/apex-release.p12"
          if [ -n "${APEX_KEYSTORE_B64:-}" ]; then
            printf '%s' "$APEX_KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$APEX_KS_PASS"
          else
            if [ "$PUBLISH" = "true" ]; then echo "::error::APEX_KEYSTORE_B64 secret is missing; refusing to publish a release signed with a throwaway key"; exit 1; fi
            echo "::warning::APEX_KEYSTORE_B64 secret not set: signing with a throwaway key (this artifact will not update over a release build)"
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias apex -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Apex LLM throwaway, O=Apex, C=US"
          fi
          export PASS

          mkdir -p dist
          "$BT/zipalign" -p -f -v 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk" >/dev/null
          OUT="dist/apex-llm-v${VERSION}-arm64-v8a.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-key-alias apex --ks-pass env:PASS --key-pass env:PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --min-sdk-version 26 \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          rm -f "$KS"

          bash scripts/verify-apk.sh "$OUT" | tee dist/verify-report.txt
          cp "$OUT" "dist/apex-llm-v${VERSION}-android.apk"
          # Same signed bytes under the display name used in the release notes / version.json.
          cp "$OUT" "dist/Apex-LLM-v${VERSION}-arm64-release.apk"
          (cd dist && sha256sum apex-llm-*.apk Apex-LLM-*.apk > "apex-llm-v${VERSION}.sha256")
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: apex-llm-v${{ env.VERSION }}-${{ github.sha }}
          path: dist/*
          retention-days: 30
      - name: Publish GitHub Release (retries, uploads.github.com sometimes answers 502)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="docs/release-notes/${TAG}.md"
          [ -f "$NOTES_FILE" ] || { echo "Apex LLM ${TAG}" > "$RUNNER_TEMP/notes.md"; NOTES_FILE="$RUNNER_TEMP/notes.md"; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --latest --target "${GITHUB_SHA}" --title "Apex LLM ${TAG}" --notes-file "$NOTES_FILE"
          else
            gh release edit "$TAG" --notes-file "$NOTES_FILE" --latest
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/apex-llm-*.apk dist/Apex-LLM-*.apk dist/apex-llm-*.sha256 dist/verify-report.txt --clobber; then
              echo "uploaded on attempt $attempt"; exit 0
            fi
            echo "upload attempt $attempt failed, retrying in $((attempt * 20))s"; sleep $((attempt * 20))
          done
          echo "all upload attempts failed"; exit 1
