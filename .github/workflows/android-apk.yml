# EXPERIMENTAL / UNVERIFIED — written in Session 2 without an Android toolchain available.
# Manual trigger only so it can never turn the main branch red. Expect to iterate on the first runs.
name: Android APK (experimental)

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.3.11579264
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK r26
        run: sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-ui/src-tauri
      - name: Frontend
        working-directory: web-showcase
        run: npm ci && npm run build:app
      - name: Tauri Android project
        working-directory: app-ui
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri android init
          cargo tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: apex-arm64-apk
          path: app-ui/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
