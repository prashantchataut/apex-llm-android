name: Web CI

on:
  pull_request:
    paths: ["web-showcase/**", "packages/design-system/**"]
  push:
    branches-ignore: [main]
    paths: ["web-showcase/**", "packages/design-system/**"]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-showcase/package-lock.json
      - name: Design tokens are in sync
        run: |
          cmp packages/design-system/tokens.css web-showcase/src/app/tokens.css
          cmp packages/design-system/haptics/haptics.ts web-showcase/src/lib/haptics.ts
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
        working-directory: web-showcase
      - run: npm run typecheck
        working-directory: web-showcase
      - run: npm run build
        working-directory: web-showcase
