name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web-showcase/**"
      - "packages/design-system/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-showcase/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install
        run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
        working-directory: web-showcase
      - name: Typecheck
        run: npm run typecheck
        working-directory: web-showcase
      - name: Build static export
        run: npm run build
        working-directory: web-showcase
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-showcase/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
