[package]
name = "apex-app"
version = "0.1.0"
edition = "2021"
description = "Apex — Tauri v2 Mobile shell around the cortex-* crates"

# Standalone workspace: keeps desktop CI free of webkit / Android SDK requirements.
[workspace]

[lib]
name = "apex_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
cortex-hardware = { path = "../../crates/cortex-hardware" }
cortex-hf-hub = { path = "../../crates/cortex-hf-hub" }
# Pure-Rust candle GGUF engine: no CMake / C++ in the Android cross-compile.
cortex-inference = { path = "../../crates/cortex-inference", features = ["candle"] }
cortex-voice = { path = "../../crates/cortex-voice" }
cortex-server = { path = "../../crates/cortex-server" }
cortex-integrations = { path = "../../crates/cortex-integrations" }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[features]
# Kept for the CI invocation (`--features android`). The candle engine needs no C++ runtime, so this is a no-op marker.
android = []

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# candle's quantized matmul kernels must be optimised even in `cargo tauri android build --debug`.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
